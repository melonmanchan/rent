[package]
name = "rent"
version = "0.1.0"
edition = "2024"
description = "simple plaintext presentation tool - a Rust port of suckless sent"
license = "MIT"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# glyph rasterization at large sizes is unusable without optimizations
[profile.dev]
opt-level = 1
